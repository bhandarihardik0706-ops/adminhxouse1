    applyTheme(localStorage.getItem('admin_theme') || 'light');
    renderSidebar();
    navigateTo('dashboard');

    document.body.addEventListener('click', () => {
        if (!state.audioInitialized) {
            const audio = $('#notification-sound');
            audio.play().then(() => { audio.pause(); state.audioInitialized = true; });
        }
    }, { once: true });

          if (state.currentPage === 'orders') renderCurrentPage();
      })
      .subscribe();

function navigateTo(page) {
    state.currentPage = page;
    renderSidebar();
    renderCurrentPage();
}

function renderSidebar() {
    const nav = $('#sidebar-nav');
    nav.innerHTML = Object.keys(PAGES).map(key => `
        <button onclick="navigateTo('${key}')" class="w-full flex items-center px-6 py-4 text-[10px] font-black uppercase tracking-[0.25em] rounded-2xl transition-all ${state.currentPage === key ? 'bg-primary text-primary-foreground shadow-xl' : 'text-muted-foreground hover:bg-secondary'}">
            <span class="mr-4 text-xl">${PAGES[key].icon}</span> ${PAGES[key].title}
        </button>
    `).join('');
}

function renderCurrentPage() {
    const c = $('#page-content');
    $('#page-title').textContent = PAGES[state.currentPage].title;
    PAGES[state.currentPage].render(c);
}

async function renderDashboard(c) {
    const today = new Date(); today.setHours(0,0,0,0);
    const { data: orders } = await sb.from('orders').select('*').gte('created_at', today.toISOString());
    
    const totalRevenue = orders?.reduce((acc, o) => acc + (o.total_amount || 0), 0) || 0;
    const pendingCount = orders?.filter(o => o.status === 'received' || o.status === 'preparing').length || 0;

    c.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 fade-in">
            <div class="bg-card p-12 rounded-[3.5rem] border border-border shadow-sm">
                <p class="text-[10px] font-black uppercase opacity-40 mb-2 tracking-widest text-muted-foreground">Today's Revenue</p>

                <h3 class="text-6xl font-black tracking-tighter">${orders?.length || 0}</h3>
            </div>
        </div>
        
        <div class="bg-card p-12 rounded-[3.5rem] border border-border fade-in">
            <h3 class="font-black text-xl mb-10 uppercase tracking-tighter">Live Activity Feed</h3>
            <div class="space-y-4">
                ${orders?.slice(0, 5).reverse().map(o => `
                    <div class="p-8 bg-secondary rounded-[2.5rem] flex justify-between items-center border border-border">
                        <div>
                            <p class="font-black text-sm uppercase tracking-tight">Order #${o.id.slice(0,5)} • Table ${o.table_id || '?'}</p>
                            <p class="text-[10px] opacity-40 font-bold uppercase mt-1">${new Date(o.created_at).toLocaleTimeString()}</p>
                        </div>
                        <span class="status-badge status-${o.status}">${o.status}</span>

                `).join('') || '<p class="text-center py-20 opacity-20 uppercase font-black text-xs tracking-widest">Awaiting activity...</p>'}
            </div>
        </div>
    `;
}

}

// --- CORE LOGIC ---

async function updateOrderStatus(id, status) {
    const { error } = await sb.from('orders').update({ status }).eq('id', id);
    if (!error) showToast(`Reference stage set: ${status.toUpperCase()}`);
    else showToast("Communication Error", true);
}

async function searchLoyaltyMembers() {
    const q = $('#loyalty-search').value;
    const res = $('#loyalty-results');
    const { data } = await sb.from('customers').select('*').or(`name.ilike.%${q}%,whatsapp_number.ilike.%${q}%`);
    
    if (!data || data.length === 0) {
        res.innerHTML = `<div class="p-24 text-center opacity-20 uppercase font-black text-xs tracking-widest">Identity not found</div>`;
        return;
    }

    res.innerHTML = data.map(m => `
        <div class="p-12 bg-secondary rounded-[3.5rem] flex justify-between items-center border border-border shadow-sm hover:border-primary transition duration-300">
            <div>
                <h4 class="font-black uppercase text-3xl tracking-tighter mb-2">${m.name}</h4>
                <p class="text-xs font-bold opacity-40 tracking-[0.2em] uppercase">+91 ${m.whatsapp_number}</p>
            </div>
            <div class="text-right">
                <p class="text-[10px] font-black uppercase opacity-30 tracking-widest mb-1 leading-none">Wallet</p>
                <p class="text-6xl font-black tracking-tighter leading-none mb-6">${m.loyalty_points}</p>
                <button onclick="openLoyaltyAdjustment('${m.id}', '${m.name}', ${m.loyalty_points})" class="bg-primary text-primary-foreground px-10 py-3 rounded-2xl font-black uppercase text-[10px] tracking-widest active:scale-95 transition shadow-lg">Edit Wallet</button>
            </div>
        </div>
    `).join('');
}

function openLoyaltyAdjustment(id, name, current) {
    state.selectedMember = { id, name, current };
    $('#loyalty-member-name').textContent = `${name} (Currently ${current} Pts)`;
    $('#loyalty-modal').classList.remove('hidden');
}

async function updateMemberPoints(action) {
    const delta = parseInt($('#points-delta').value) || 0;
    if (delta <= 0) return showToast("Invalid amount", true);
    
    const newPts = action === 'add' ? state.selectedMember.current + delta : Math.max(0, state.selectedMember.current - delta);
    
    const { error } = await sb.from('customers').update({ loyalty_points: newPts }).eq('id', state.selectedMember.id);
    if (!error) {
        showToast(`Wallet updated to ${newPts}`);
        $('#loyalty-modal').classList.add('hidden');
        searchLoyaltyMembers();
    } else showToast("Wallet Sync Error", true);
}

function generateQR() {
    const table = $('#qr-table').value;
    if (!table) return;
    const url = `https://hxouse1.onrender.com/?table=${table}`;
    const qr = qrcode(0, 'H');
    qr.addData(url);
    qr.make();
    $('#qr-img').innerHTML = qr.createImgTag(12, 0);
    $('#qr-display').classList.remove('hidden');
}

// --- MENU LOGIC ---

function openMenuModal() {
    $('#prod-id').value = '';
    $('#product-form').reset();
    $('#menu-modal-title').textContent = "Add Product";
    $('#menu-modal').classList.remove('hidden');
}

async function editProduct(id) {
    const { data } = await sb.from('products').select('*').eq('id', id).single();
    if (data) {
        $('#prod-id').value = data.id;
        $('#prod-name').value = data.name;
        $('#prod-category').value = data.category;
        $('#prod-price').value = data.price;
        $('#prod-available').checked = data.is_available;
        $('#menu-modal-title').textContent = "Edit Product";
        $('#menu-modal').classList.remove('hidden');
    }
}

$('#product-form').addEventListener('submit', async (e) => {
    e.preventDefault();
    const id = $('#prod-id').value;
    const item = {
        name: $('#prod-name').value,
        category: $('#prod-category').value,
        price: parseFloat($('#prod-price').value),
        is_available: $('#prod-available').checked
    };

    const { error } = id ? await sb.from('products').update(item).eq('id', id) : await sb.from('products').insert([item]);
    
    if (!error) {
        showToast(`Product ${id ? 'Updated' : 'Added'}`);
        $('#menu-modal').classList.add('hidden');
        renderMenu($('#page-content'));
    } else showToast("Menu Sync Error", true);
});

async function deleteProduct(id) {
    if (confirm("Permanently purge this item from the collective menu?")) {
        await sb.from('products').delete().eq('id', id);
        renderMenu($('#page-content'));
        showToast("Product Purged");
    }
}

// --- UTILS ---

function showToast(m, e = false) {
    const t = $('#toast'); $('#toast-message').textContent = m.toUpperCase();
    t.className = `fixed bottom-10 right-10 text-white py-5 px-12 rounded-[2.5rem] shadow-2xl text-[10px] font-black uppercase tracking-widest z-[200] ${e ? 'bg-red-500' : 'bg-black'}`;
    t.classList.remove('hidden', 'fade-in'); void t.offsetWidth; t.classList.add('fade-in');
    setTimeout(() => t.classList.add('hidden'), 2500);
}

function playAlert() {
    if (state.audioInitialized) {
        const a = $('#notification-sound'); a.currentTime = 0; a.play().catch(() => {});
    }
}

function showNewOrderModal(order) {
    const modal = $('#alert-modal');
    $('#alert-modal-content').innerHTML = `
        <div class="flex flex-col items-center">
            <div class="w-36 h-36 bg-green-500 rounded-full flex items-center justify-center mb-12 shadow-[0_0_50px_rgba(34,197,94,0.4)] animate-bounce">
                <span class="text-7xl">📦</span>
            </div>
            <h2 class="text-6xl font-black uppercase tracking-tighter leading-none mb-4">INCOMING <br> TICKET</h2>
            <p class="text-sm font-black opacity-40 uppercase tracking-[0.8em] mb-16">TABLE #${order.table_id || order.table_number_input || '?'}</p>
            <button onclick="$('#alert-modal').classList.add('hidden')" class="w-full bg-primary text-primary-foreground py-8 rounded-[3rem] font-black uppercase tracking-widest shadow-xl active:scale-95 transition">Acknowledge</button>
        </div>
    `;
    modal.classList.remove('hidden');
}

function applyTheme(t) {
    state.theme = t; localStorage.setItem('admin_theme', t); document.documentElement.className = t;
}

async function printBill(orderId) {
    const { data: o } = await sb.from('orders').select('*, order_items(*, products(*)), tables(table_number)').eq('id', orderId).single();
    if (!o) return;
    const printArea = $('#printable-area');
    printArea.innerHTML = `
        <div style="font-family: 'Courier New', Courier, monospace; width: 80mm; padding: 6mm; text-align: center; font-weight: 900; color: black; background: white; line-height: 1.2;">
            <h1 style="font-size: 24px; margin: 0;">HXOUSE COFFEE CO.</h1>
            <p style="font-size: 11px; margin: 3px 0; letter-spacing: 2px;">CREATIVE COLLECTIVE JAIPUR</p>
            <hr style="border-top: 2px dashed black; margin: 6mm 0;">
            <p style="text-align: left; font-size: 12px; margin-bottom: 2mm;">SPOT: #${o.tables?.table_number || o.table_id || '?'}</p>
            <p style="text-align: left; font-size: 12px; margin-bottom: 2mm;">TICKET: #${o.id.slice(0,8).toUpperCase()}</p>
            <p style="text-align: left; font-size: 10px; opacity: 0.6;">DATE: ${new Date(o.created_at).toLocaleString()}</p>
            <hr style="border-top: 1px dashed black; margin: 6mm 0;">
            <table style="width: 100%; font-size: 12px; text-align: left;">
                ${o.order_items?.map(item => `
                    <tr><td>${item.quantity} x ${item.products?.name || 'Custom Meal'}</td><td style="text-align: right;">₹${(item.price_at_time_of_order * item.quantity).toFixed(0)}</td></tr>
                `).join('') || ''}
            </table>
            <hr style="border-top: 2px solid black; margin: 6mm 0;">
            <div style="text-align: right; font-size: 18px; margin-bottom: 8mm;"><strong>TOTAL: ₹${o.total_amount.toFixed(0)}</strong></div>
            <p style="font-size: 11px; letter-spacing: 1px;">STAY FOCUSED. STAY CREATIVE.</p>
        </div>
    `;
    window.print();
}

// Auth Lifecycle
document.addEventListener('DOMContentLoaded', async () => {
    $('#login-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const btn = $('#login-submit'); btn.disabled = true; btn.textContent = "VERIFYING...";
        const { data, error } = await sb.auth.signInWithPassword({ email: $('#email').value, password: $('#password').value });
        if (error) { $('#login-error').textContent = error.message; btn.disabled = false; btn.textContent = "ACCESS CONSOLE"; }
        else { state.user = data.user; initializeApp(); }
    });
    const { data: { session } } = await sb.auth.getSession();
    if (session) { state.user = session.user; initializeApp(); }
    else $('#login-screen').classList.remove('hidden');
});

$('#theme-toggle').onclick = () => applyTheme(state.theme === 'light' ? 'dark' : 'light');
$('#logout-btn').onclick = async () => { await sb.auth.signOut(); window.location.reload(); };

</script>
</body>
</html>
