// --- INITIALIZATION ---

async function initAdmin() {
    $('#login-screen').classList.add('hidden');
    $('#app-container').classList.remove('hidden');
    $('#user-email').textContent = state.user.email;

    await refreshGlobalData();
    setupAdminRealtime();
    navigateTo('dashboard');
    
    document.body.addEventListener('click', () => {
        if (!state.audioReady) {
            const audio = $('#notification-sound');
            audio.play().then(() => { audio.pause(); state.audioReady = true; }).catch(()=>{});
        }
    }, { once: true });
}

async function refreshGlobalData() {
    const { data: set } = await sb.from('app_settings').select('*');
    state.settings = (set || []).reduce((acc, s) => ({ ...acc, [s.key]: s.value }), {});
    
    const { data: menu } = await sb.from('products').select('*').order('name');
    state.menuItems = menu || [];
}

function navigateTo(page) {
    state.currentPage = page;
    const container = $('#page-content');
    $('#page-title').textContent = PAGES[page].title;
    
    $('#sidebar-nav').innerHTML = Object.keys(PAGES).map(key => `
        <button onclick="navigateTo('${key}')" class="w-full flex items-center px-8 py-5 text-[11px] font-black uppercase tracking-[0.3em] rounded-2xl transition-all ${state.currentPage === key ? 'bg-primary text-primary-foreground shadow-2xl scale-105 italic' : 'text-muted-foreground hover:bg-secondary'}">
            ${PAGES[key].title}
        </button>
    `).join('');

    container.innerHTML = `<div class="p-20 text-center"><div class="spinner mx-auto mb-6"></div><p class="text-[10px] font-black uppercase opacity-40 tracking-[0.5em]">Establishing Sync...</p></div>`;
    PAGES[page].render(container);
}

function setupAdminRealtime() {
    sb.channel('admin-terminal').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'orders' }, async (p) => {
        if (state.audioReady) $('#notification-sound').play();
        triggerModalAlert("NEW ORDER RECEIVED", `AMOUNT: ₹${p.new.total_amount}`, 'orders');
        if (['dashboard', 'orders'].includes(state.currentPage)) navigateTo(state.currentPage);
    }).on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'staff_calls' }, async (p) => {
        if (state.audioReady) $('#notification-sound').play();
        triggerModalAlert("SERVICE CALL", "Table assistance required!", 'alerts');
        if (['dashboard', 'alerts'].includes(state.currentPage)) navigateTo(state.currentPage);
    }).subscribe();
}

function triggerModalAlert(title, sub, page) {
    const modal = $('#alert-modal');
    $('#alert-modal-content').innerHTML = `
        <h2 class="text-4xl font-black mb-4 text-primary uppercase tracking-tighter italic">${title}</h2>
        <p class="text-muted-foreground mb-12 font-bold uppercase text-xs tracking-widest leading-relaxed">${sub}</p>
        <div class="flex space-x-4">
            <button onclick="dismissAlert()" class="flex-1 bg-secondary py-6 rounded-3xl font-black text-[10px] uppercase tracking-widest">Ignore</button>
            <button onclick="dismissAlert(); navigateTo('${page}')" class="flex-1 bg-primary text-primary-foreground py-6 rounded-3xl font-black text-[10px] uppercase tracking-widest shadow-2xl">Manage Now</button>
        </div>
    `;
    modal.classList.remove('hidden');
}

function dismissAlert() { $('#alert-modal').classList.add('hidden'); }

// --- DASHBOARD MODULE ---

async function renderDashboard(c) {
    const startOfDay = new Date(); startOfDay.setHours(0,0,0,0);
    const { data: dayOrders } = await sb.from('orders').select('*').gte('created_at', startOfDay.toISOString());
    const { count: helpCount } = await sb.from('staff_calls').select('*', { count: 'exact', head: true }).eq('status', 'pending');
    
    let actualRevenue = 0, grossRevenue = 0;
    (dayOrders || []).forEach(o => {
        actualRevenue += o.total_amount;
        const disc = o.discount_percentage || 0;
        grossRevenue += (o.total_amount / 1.05) / (1 - disc/100) * 1.05;
    });

    c.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-3 gap-8 fade-in">
            <div class="bg-card p-12 rounded-[3rem] border border-border shadow-sm">
                <p class="text-[10px] font-black uppercase opacity-40 mb-3 tracking-widest text-center">Net Revenue</p>
                <p class="text-5xl font-black tracking-tighter text-center italic">₹${actualRevenue.toFixed(0)}</p>
                <div class="mt-6 flex justify-between text-[9px] font-black uppercase opacity-30"><span>Gross: ₹${grossRevenue.toFixed(0)}</span><span>Disc: ₹${(grossRevenue - actualRevenue).toFixed(0)}</span></div>
            </div>
            <div class="bg-card p-12 rounded-[3rem] border border-border shadow-sm">
                <p class="text-[10px] font-black uppercase opacity-40 mb-3 tracking-widest text-center">Active Tickets</p>
                <p class="text-5xl font-black tracking-tighter text-center italic">${dayOrders?.length || 0}</p>
            </div>
            <div class="bg-card p-12 rounded-[3rem] border border-border shadow-sm">
                <p class="text-[10px] font-black uppercase opacity-40 mb-3 tracking-widest text-center">Help Needed</p>
                <p class="text-5xl font-black tracking-tighter text-center italic ${helpCount > 0 ? 'text-red-500 animate-pulse' : ''}">${helpCount || 0}</p>
            </div>
        </div>
        <div class="bg-card p-12 rounded-[4rem] border border-border">
            <canvas id="mainChart" class="w-full max-h-96"></canvas>
        </div>
    `;

    new Chart($('#mainChart'), {
        type: 'line',
        data: {
            labels: ['Morning', 'Lunch', 'Afternoon', 'Evening', 'Night'],
            datasets: [{ 
                data: [10, 45, 30, 85, 40], 
                borderColor: '#1a1a1a', 
                backgroundColor: 'rgba(0,0,0,0.02)',
                fill: true,
                tension: 0.5,
                pointRadius: 0
            }]
        },
        options: { responsive: true, plugins: { legend: { display: false } }, scales: { y: { display: false }, x: { grid: { display: false } } } }
    });
}

// --- ORDER MODULE ---

async function renderOrders(c) {
    const { data } = await sb.from('orders').select('*, tables(table_number), customers(name), order_items(*, products(name))').order('created_at', { ascending: false }).limit(40);
    
    c.innerHTML = `
        <div class="bg-card rounded-[3rem] border border-border overflow-hidden fade-in shadow-xl">
            <div class="divide-y divide-border">
                ${(data || []).map(o => `
                    <div class="p-10 flex flex-wrap items-center justify-between hover:bg-secondary/20 transition">
                        <div class="flex items-center space-x-10">
                            <div class="w-20 h-20 rounded-[2rem] bg-secondary flex items-center justify-center font-black text-2xl shadow-inner border border-border">#${o.tables?.table_number || '?'}</div>
                            <div>
                                <p class="font-black uppercase text-base tracking-tighter italic">${o.customers?.name || 'Walk-in'}</p>
                                <p class="text-[11px] font-bold opacity-30 uppercase tracking-widest mb-3">₹${o.total_amount.toFixed(2)} • ${o.source || 'CLIENT'}</p>
                                <div class="flex flex-wrap gap-2">
                                    ${o.order_items.map(i => `<span class="bg-primary/5 px-3 py-1 rounded-full text-[10px] font-black uppercase opacity-70 border border-border">${i.products?.name} x${i.quantity}</span>`).join('')}
                                </div>
                            </div>
                        </div>
                        <div class="flex items-center space-x-6 mt-8 lg:mt-0">
                            <select onchange="statusUpdate('${o.id}', this.value)" class="bg-secondary px-6 py-4 rounded-2xl text-[10px] font-black uppercase border-none outline-none ring-1 ring-border focus:ring-primary">
                                <option value="received" ${o.status === 'received' ? 'selected' : ''}>Received</option>
                                <option value="preparing" ${o.status === 'preparing' ? 'selected' : ''}>Preparing</option>
                                <option value="delivered" ${o.status === 'delivered' ? 'selected' : ''}>Delivered</option>
                                <option value="cancelled" ${o.status === 'cancelled' ? 'selected' : ''}>Cancelled</option>
                            </select>
                            <button onclick="runPetPooja('${o.id}', ${o.tables?.table_number}, ${o.total_amount})" class="bg-primary text-primary-foreground px-8 py-4 rounded-2xl font-black text-[10px] uppercase tracking-[0.2em] shadow-2xl active:scale-90 transition">GENERATE POS BILL</button>
                        </div>
                    </div>
                `).join('') || '<div class="p-20 text-center opacity-30 font-black uppercase text-xs tracking-widest">No active tickets found</div>'}
            </div>
        </div>
    `;
}

async function statusUpdate(id, s) {
    await sb.from('orders').update({ status: s }).eq('id', id);
    showToast(`Order status synced: ${s}`);
}

// --- POS TERMINAL MODULE ---

async function renderPOS(c) {
    const { data: tables } = await sb.from('tables').select('*').order('table_number');
    
    c.innerHTML = `
        <div class="grid grid-cols-1 md:grid-cols-3 gap-10 h-full fade-in min-h-[700px]">
            <div class="md:col-span-2 flex flex-col space-y-8 h-full">
                <div class="flex items-center justify-between">
                    <div id="pos-table-display" class="bg-primary text-primary-foreground px-8 py-3 rounded-full font-black text-xs uppercase tracking-widest">SELECT TABLE</div>
                    <input type="text" id="pos-search" placeholder="Search item..." class="w-1/2 p-4 bg-card border border-border rounded-2xl font-bold shadow-sm outline-none focus:border-primary">
                </div>
                <div class="grid grid-cols-2 md:grid-cols-4 gap-4 overflow-y-auto pr-2" id="pos-menu-grid"></div>
            </div>
            <div class="bg-card rounded-[3rem] border border-border shadow-2xl p-10 flex flex-col">
                <h3 class="font-black text-lg uppercase tracking-tighter italic mb-8">Cart Items</h3>
                <div id="pos-cart-list" class="flex-grow space-y-4 overflow-y-auto mb-8 pr-2"></div>
                <div class="pt-8 border-t border-border space-y-4">
                    <div class="flex justify-between font-black text-xs opacity-40 uppercase"><span>Subtotal</span><span id="pos-sub">₹0</span></div>
                    <div class="flex justify-between items-center">
                        <label class="text-[10px] font-black uppercase opacity-40">Discount %</label>
                        <input type="number" id="pos-disc" value="0" class="w-20 p-2 bg-secondary rounded-lg font-black text-center outline-none">
                    </div>
                    <div class="flex justify-between font-black text-3xl tracking-tighter uppercase italic pt-4"><span>Grand Total</span><span id="pos-tot">₹0</span></div>
                    <button id="pos-submit" class="w-full bg-primary text-primary-foreground py-6 rounded-[2rem] font-black text-lg shadow-xl uppercase active:scale-95 transition" disabled>SAVE & KOT</button>
                </div>
            </div>
        </div>
        <div id="table-picker" class="fixed inset-0 bg-black/95 z-[120] flex items-center justify-center p-10 backdrop-blur-xl">
            <div class="w-full max-w-4xl text-center">
                <h2 class="text-4xl font-black text-white mb-12 uppercase tracking-tighter italic">Select Terminal Spot</h2>
                <div class="grid grid-cols-4 md:grid-cols-6 gap-6">
                    ${(tables || []).map(t => `<button onclick="setPOSTable(${t.table_number})" class="p-8 bg-white/5 hover:bg-white text-white hover:text-black border border-white/20 rounded-[2rem] font-black text-2xl transition-all">${t.table_number}</button>`).join('')}
                </div>
            </div>
        </div>
    `;

    renderPOSMenu();
    $('#pos-disc').oninput = updatePOSSummary;
}

function setPOSTable(num) {
    state.activeTable = num;
    $('#pos-table-display').textContent = `TABLE #${num}`;
    $('#table-picker').classList.add('hidden');
    updatePOSSummary();
}

function renderPOSMenu(q = '') {
    const grid = $('#pos-menu-grid');
    if(!grid) return;
    grid.innerHTML = state.menuItems.filter(i => i.name.toLowerCase().includes(q.toLowerCase())).map(item => `
        <button onclick="addToPOSCart(${item.id})" class="p-5 bg-card border border-border rounded-2xl text-left hover:border-primary transition group shadow-sm">
            <p class="font-black uppercase text-[10px] leading-tight mb-2 tracking-tighter">${item.name}</p>
            <p class="text-xs font-bold opacity-30 italic">₹${item.price}</p>
        </button>
    `).join('');
}

function addToPOSCart(id) {
    const item = state.menuItems.find(i => i.id === id);
    const exist = state.posCart.find(i => i.id === id);
    if(exist) exist.qty++;
    else state.posCart.push({ ...item, qty: 1 });
    updatePOSSummary();
}

function updatePOSSummary() {
    const list = $('#pos-cart-list');
    if(!list) return;
    list.innerHTML = state.posCart.map((i, idx) => `
        <div class="flex items-center justify-between p-4 bg-secondary rounded-2xl border border-border">
            <div><p class="font-black text-[10px] uppercase tracking-tighter">${i.name}</p></div>
            <div class="flex items-center space-x-3">
                <button onclick="state.posCart[${idx}].qty--; if(state.posCart[${idx}].qty<1) state.posCart.splice(${idx},1); updatePOSSummary()" class="w-8 h-8 rounded-full border border-border font-black">−</button>
                <span class="font-black text-xs">${i.qty}</span>
                <button onclick="state.posCart[${idx}].qty++; updatePOSSummary()" class="w-8 h-8 rounded-full border border-border font-black">+</button>
            </div>
        </div>
    `).join('') || '<p class="p-10 text-center opacity-20 font-black uppercase text-[10px]">Cart Empty</p>';

    const sub = state.posCart.reduce((s, i) => s + (i.price * i.qty), 0);
    const disc = parseFloat($('#pos-disc').value) || 0;
    const tot = (sub - (sub * disc/100)) * 1.05;

    $('#pos-sub').textContent = `₹${sub.toFixed(0)}`;
    $('#pos-tot').textContent = `₹${tot.toFixed(0)}`;
    $('#pos-submit').disabled = (state.posCart.length === 0 || !state.activeTable);
    
    $('#pos-submit').onclick = async () => {
        $('#pos-submit').disabled = true;
        const payload = {
            table_number_input: state.activeTable,
            total_amount_input: tot,
            discount_percentage_input: disc,
            source_input: 'Staff',
            order_items: state.posCart.map(i => ({ product_id: i.id, quantity: i.qty, price_at_time_of_order: i.price }))
        };
        const { data, error } = await sb.rpc('create_order_with_items', payload);
        if(!error) { showToast("Sync Complete"); state.posCart = []; updatePOSSummary(); navigateTo('orders'); }
        else showToast("Sync Error", true);
    };
}

// --- CRM MODULE ---

async function renderCRM(c) {
    c.innerHTML = `
        <div class="flex flex-wrap gap-4 mb-10 fade-in">
            <input type="text" id="crm-search" placeholder="Search Name or WhatsApp..." class="flex-grow p-5 bg-card border border-border rounded-[2rem] font-bold shadow-xl outline-none focus:ring-2 ring-primary">
            <button onclick="loadCRM()" class="bg-primary text-primary-foreground px-12 py-5 rounded-[2rem] font-black uppercase text-xs tracking-widest shadow-xl">Search</button>
        </div>
        <div class="bg-card rounded-[3rem] border border-border overflow-hidden shadow-sm"><div id="crm-list" class="divide-y divide-border"></div></div>
    `;
    loadCRM();
}

async function loadCRM() {
    const q = $('#crm-search')?.value;
    let query = sb.from('customers').select('*').order('created_at', { ascending: false }).limit(50);
    if (q) query = query.or(`name.ilike.%${q}%,whatsapp_number.ilike.%${q}%`);
    const { data } = await query;
    const list = $('#crm-list');
    if(!list) return;

    list.innerHTML = (data || []).map(u => `
        <div class="p-10 flex items-center justify-between hover:bg-secondary/30 transition">
            <div class="flex items-center space-x-8">
                <div class="w-16 h-16 rounded-full bg-secondary flex items-center justify-center text-2xl shadow-inner border border-border">👤</div>
                <div><p class="font-black uppercase text-sm italic tracking-tighter">${u.name}</p><p class="text-[10px] font-bold opacity-30 mt-1 tracking-widest">+91 ${u.whatsapp_number}</p></div>
            </div>
            <div class="flex items-center space-x-12">
                <div class="text-right"><p class="text-[9px] font-black uppercase opacity-40 mb-1">Loyalty Wallet</p><p class="font-black text-3xl tracking-tighter italic uppercase text-primary">${u.loyalty_points} PTS</p></div>
                <div class="flex space-x-3">
                    <button onclick="modPoints('${u.id}', 50)" class="w-14 h-14 bg-green-500/10 text-green-600 rounded-3xl font-black text-xl shadow-sm transition active:scale-90 hover:bg-green-500 hover:text-white">+</button>
                    <button onclick="modPoints('${u.id}', -50)" class="w-14 h-14 bg-red-500/10 text-red-600 rounded-3xl font-black text-xl shadow-sm transition active:scale-90 hover:bg-red-500 hover:text-white">−</button>
                    <button onclick="deleteMember('${u.id}')" class="p-4 opacity-10 hover:opacity-100 transition grayscale hover:grayscale-0">🗑</button>
                </div>
            </div>
        </div>
    `).join('') || '<div class="p-20 text-center opacity-30 font-black text-xs uppercase tracking-widest italic">No customers found</div>';
}

async function modPoints(id, amt) {
    const { error } = await sb.rpc(amt > 0 ? 'increment_loyalty_points' : 'redeem_loyalty_points', { customer_id_input: id, [amt > 0 ? 'points_to_add' : 'points_to_redeem']: Math.abs(amt) });
    if (!error) { showToast("Sync Complete"); loadCRM(); }
    else showToast("Sync Error", true);
}

async function deleteMember(id) {
    if (confirm("Permanently wipe member record?")) { await sb.from('customers').delete().eq('id', id); loadCRM(); }
}

// --- INTEGRATION: PET POOJA ---

function runPetPooja(id, table, amt) {
    const url = state.settings.pet_pooja_base_url;
    const rid = state.settings.pet_pooja_restaurant_id;

    if (!url || !rid || !url.includes('http')) {
        showToast("POS GATEWAY CONFIG REQUIRED", true);
        navigateTo('config');
        return;
    }
    const final = `${url}?restaurant_id=${rid}&table_no=${table}&order_id=${id}&amount=${amt}`;
    window.open(final, '_blank');
}

// --- ENGINE CONFIG ---

async function renderSettings(c) {
    c.innerHTML = `
        <div class="bg-card p-14 rounded-[4rem] border border-border shadow-2xl max-w-2xl fade-in mx-auto">
            <h3 class="text-3xl font-black mb-12 uppercase tracking-tighter italic">System Config</h3>
            <form id="config-form" class="space-y-8">
                <div>
                    <label class="text-[10px] font-black uppercase opacity-40 ml-4 tracking-[0.3em]">POS Billing Gateway</label>
                    <input type="text" name="pet_pooja_base_url" value="${state.settings.pet_pooja_base_url || 'https://pos.petpooja.com/billing'}" class="w-full mt-3 p-6 bg-secondary rounded-[2rem] font-bold border-none outline-none focus:ring-2 ring-primary shadow-inner">
                </div>
                <div>
                    <label class="text-[10px] font-black uppercase opacity-40 ml-4 tracking-[0.3em]">Terminal Auth Token</label>
                    <input type="text" name="pet_pooja_restaurant_id" value="${state.settings.pet_pooja_restaurant_id || ''}" class="w-full mt-3 p-6 bg-secondary rounded-[2rem] font-bold border-none outline-none focus:ring-2 ring-primary shadow-inner">
                </div>
                <div class="pt-8">
                    <button type="submit" class="w-full bg-primary text-primary-foreground py-7 rounded-[2.5rem] font-black text-xl shadow-2xl active:scale-95 transition tracking-widest uppercase">Sync Global Config</button>
                </div>
            </form>
        </div>
    `;

    $('#config-form').onsubmit = async (e) => {
        e.preventDefault();
        const data = new FormData(e.target);
        const upd = Array.from(data.entries()).map(([k, v]) => ({ key: k, value: v }));
        const { error } = await sb.from('app_settings').upsert(upd);
        if (!error) { showToast("Config Live"); refreshGlobalData(); }
        else showToast("Sync Error", true);
    };
}

// --- BOOTSTRAP ---

function showToast(m, err = false) {
    const t = $('#toast'); t.querySelector('p').textContent = m.toUpperCase();
    t.classList.remove('hidden', 'bg-destructive');
    if(err) t.classList.add('bg-destructive');
    setTimeout(() => t.classList.add('hidden'), 2500);
}

// Feature Stubs (Expandable)
function renderAlerts(c) { 
    c.innerHTML = `<div id="call-list" class="bg-card rounded-[3rem] border border-border overflow-hidden fade-in shadow-xl"></div>`;
    sb.from('staff_calls').select('*, tables(table_number)').eq('status', 'pending').order('created_at', { ascending: true }).then(({data}) => {
        $('#call-list').innerHTML = (data || []).map(call => `
            <div class="p-10 flex items-center justify-between border-b border-border last:border-0 hover:bg-secondary/20 transition">
                <div class="flex items-center space-x-10">
                    <div class="w-20 h-20 bg-red-500 rounded-[2.5rem] flex items-center justify-center text-white text-4xl shadow-xl animate-pulse">🛎</div>
                    <div><p class="font-black uppercase text-xl italic tracking-tighter">TABLE #${call.tables?.table_number}</p><p class="text-[11px] font-bold opacity-30 uppercase tracking-widest mt-1">REQUEST: ${call.call_type}</p></div>
                </div>
                <button onclick="sb.from('staff_calls').update({status:'resolved'}).eq('id','${call.id}').then(()=>navigateTo('alerts'))" class="bg-primary text-primary-foreground px-10 py-5 rounded-[2rem] font-black uppercase text-xs tracking-widest shadow-2xl active:scale-90 transition">MARK RESOLVED</button>
            </div>
        `).join('') || '<div class="p-20 text-center opacity-20 font-black uppercase text-xs tracking-[0.5em] italic">No active help requests</div>';
    });
}
function renderMenu(c) { c.innerHTML = `<div class="p-20 text-center opacity-30 font-black uppercase text-xs italic tracking-widest">Menu Library Interface Loading...</div>`; }
function renderReports(c) { c.innerHTML = `<div class="p-20 text-center opacity-30 font-black uppercase text-xs italic tracking-widest">Revenue log processor connecting...</div>`; }

document.addEventListener('DOMContentLoaded', async () => {
    $('#login-form').onsubmit = async (e) => {
        e.preventDefault();
        const { data, error } = await sb.auth.signInWithPassword({ email: $('#email').value, password: $('#password').value });
        if (error) $('#login-error').textContent = error.message.toUpperCase();
        else { state.user = data.user; initAdmin(); }
    };

    const { data: { session } } = await sb.auth.getSession();
    if (session) { state.user = session.user; initAdmin(); }
    else { $('#login-screen').classList.remove('hidden'); }
});
</script>
